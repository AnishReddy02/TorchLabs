syntax = "proto3";
package bench.v1;

service NodeService {
  // Named Session because tonic reserves `connect` for endpoint construction.
  rpc Session(stream NodeMessage) returns (stream ControlMessage);
}

message Envelope {
  string node_id = 1;
  string asset_id = 2;
  string workflow_run_id = 3;
  int64 timestamp_ms = 4;
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  STARTING = 1;
  CONNECTING = 2;
  AVAILABLE = 3;
  RESERVED = 4;
  RUNNING = 5;
  CLEANING_UP = 6;
  ERROR = 7;
}

message Inventory {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  string architecture = 4;
  uint32 cpu_count = 5;
  uint64 ram_bytes = 6;
  repeated string network_interfaces = 7;
}

message Register { Inventory inventory = 1; string node_name = 2; string version = 3; string token = 4; string capabilities_json = 5; }
message Heartbeat { NodeState state = 1; }
message StateChanged { NodeState state = 1; string detail = 2; }
message WorkflowStarted {}
message StepStarted { string step_id = 1; string phase = 2; string name = 3; int32 position = 4; string command = 5; }
message LogChunk { string step_id = 1; bytes data = 2; uint64 sequence = 3; }
message StepCompleted { string step_id = 1; int32 exit_code = 2; bool success = 3; string error = 4; uint64 duration_ms = 5; bool timed_out = 6; }
message WorkflowCompleted {}
message WorkflowFailed { string error = 1; bool cancelled = 2; bool timed_out = 3; }
message ArtifactUploaded { string artifact_id = 1; string name = 2; string path = 3; string content_type = 4; bytes data = 5; }
message ServiceObservation {
  string service_id = 1;
  bool healthy = 2;
  string summary = 3;
  string evidence_json = 4;
}
message RemediationAcknowledged { string operation_id = 1; bool accepted = 2; string reason = 3; }
message RemediationCompleted { string operation_id = 1; bool success = 2; string output = 3; string error = 4; }

message NodeMessage {
  Envelope envelope = 1;
  oneof payload {
    Register register = 10;
    Heartbeat heartbeat = 11;
    Inventory inventory = 12;
    WorkflowStarted workflow_started = 13;
    StepStarted step_started = 14;
    LogChunk stdout = 15;
    LogChunk stderr = 16;
    StepCompleted step_completed = 17;
    WorkflowCompleted workflow_completed = 18;
    WorkflowFailed workflow_failed = 19;
    StateChanged state_changed = 20;
    ArtifactUploaded artifact_uploaded = 21;
    ServiceObservation service_observation = 22;
    RemediationAcknowledged remediation_acknowledged = 23;
    RemediationCompleted remediation_completed = 24;
  }
}

message RunWorkflow {
  string workflow_run_id = 1;
  string workflow_yaml = 2;
  string bundle_url = 3;
  string bundle_sha256 = 4;
}
message CancelWorkflow { string workflow_run_id = 1; }
message ReservationChanged { bool reserved = 1; string reservation_id = 2; }
message Ping {}
message ExecuteRemediation {
  string operation_id = 1;
  string incident_id = 2;
  string action_id = 3;
  string service_id = 4;
  int64 deadline_ms = 5;
  string idempotency_key = 6;
}

message ControlMessage {
  Envelope envelope = 1;
  oneof payload {
    RunWorkflow run_workflow = 10;
    CancelWorkflow cancel_workflow = 11;
    ReservationChanged reservation_changed = 12;
    Ping ping = 13;
    ExecuteRemediation execute_remediation = 14;
  }
}
